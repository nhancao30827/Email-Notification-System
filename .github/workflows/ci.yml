name: CI

on:
	push:
		branches:
			- main
			- master
	pull_request:

jobs:
	backend-tests:
		name: Backend Tests
		runs-on: ubuntu-latest
		defaults:
			run:
				working-directory: backend
		steps:
			- name: Checkout
				uses: actions/checkout@v4

			- name: Set up Python
				uses: actions/setup-python@v5
				with:
					python-version: "3.13"
					cache: "pip"
					cache-dependency-path: backend/pyproject.toml

			- name: Install dependencies
				run: pip install ".[dev]"

			- name: Run tests
				env:
					DATABASE_URL: postgresql+asyncpg://test:test@localhost/testdb
					SECRET_KEY: ci-secret-key-that-is-32-chars
					REDIS_URL: redis://localhost:6379/15
				run: pytest -q

	frontend-checks:
		name: Frontend Lint And Build
		runs-on: ubuntu-latest
		defaults:
			run:
				working-directory: frontend
		steps:
			- name: Checkout
				uses: actions/checkout@v4

			- name: Set up Node
				uses: actions/setup-node@v4
				with:
					node-version: "22"
					cache: "npm"
					cache-dependency-path: frontend/package-lock.json

			- name: Install dependencies
				run: npm ci

			- name: Run lint
				run: npm run lint

			- name: Build
				run: npm run build
