[project]
name = "backend"
version = "0.1.0"
description = "Email Distribution System API"
requires-python = ">=3.13"
dependencies = [
    # Web framework & server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",

    # Async PostgreSQL
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",

    # Migrations
    "alembic>=1.14.0",

    # JWT authentication
    "python-jose[cryptography]>=3.3.0",

    # Password hashing
    "passlib[bcrypt]>=1.7.4",

    # Settings & environment
    "pydantic-settings>=2.8.0",
    "pydantic[email]>=2.10.0",
    "python-dotenv>=1.0.0",

    # Async email sending
    "aiosmtplib>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py", "alembic/**/*.py"]

